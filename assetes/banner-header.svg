<svg width="1000" height="260" viewBox="0 0 1000 260" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a0a0f"/>
      <stop offset="45%" stop-color="#11132a"/>
      <stop offset="100%" stop-color="#0a0a0f"/>
    </linearGradient>
    <linearGradient id="textGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38BDF8"/>
      <stop offset="55%" stop-color="#818CF8"/>
      <stop offset="100%" stop-color="#A78BFA"/>
    </linearGradient>
    <radialGradient id="glow1" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#6366F1" stop-opacity="0.35"/>
      <stop offset="100%" stop-color="#6366F1" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glow2" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#38BDF8" stop-opacity="0.25"/>
      <stop offset="100%" stop-color="#38BDF8" stop-opacity="0"/>
    </radialGradient>
    <pattern id="grid" width="42" height="42" patternUnits="userSpaceOnUse">
      <path d="M 42 0 L 0 0 0 42" fill="none" stroke="#818CF8" stroke-opacity="0.06" stroke-width="1"/>
    </pattern>
    <filter id="softGlow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="6" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <rect width="1000" height="260" fill="url(#bg)"/>
  <rect width="1000" height="260" fill="url(#grid)"/>
  <ellipse cx="200" cy="60" rx="260" ry="140" fill="url(#glow1)"/>
  <ellipse cx="820" cy="210" rx="260" ry="140" fill="url(#glow2)"/>

  <!-- glass panel -->
  <rect x="60" y="55" width="880" height="150" rx="18" fill="#ffffff" fill-opacity="0.03" stroke="#818CF8" stroke-opacity="0.25" stroke-width="1"/>
  <rect x="60" y="55" width="880" height="1" fill="#ffffff" fill-opacity="0.15"/>

  <!-- scan line -->
  <rect x="60" y="55" width="2" height="150" fill="url(#textGrad)" opacity="0.7">
    <animate attributeName="x" values="60;938;60" dur="7s" repeatCount="indefinite"/>
  </rect>

  <text x="500" y="128" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="46" font-weight="700" fill="url(#textGrad)" filter="url(#softGlow)" letter-spacing="2">MOSTAFA GALAL</text>

  <text x="500" y="162" text-anchor="middle" font-family="Consolas, 'JetBrains Mono', monospace" font-size="16" fill="#CBD5E1" letter-spacing="1">Electronics &amp; Communications Engineer  //  Offensive Security</text>

  <text x="500" y="188" text-anchor="middle" font-family="Consolas, 'JetBrains Mono', monospace" font-size="12" fill="#64748B" letter-spacing="3">EMBEDDED SYSTEMS · PENETRATION TESTING · CTF</text>
</svg>
